# Required — the project uses AndroidX dependencies (Compose, Lifecycle,
# Room, DataStore, etc). Without this, checkDebugAarMetadata fails with
# "Configuration ... contains AndroidX dependencies, but the
# android.useAndroidX property is not enabled".
android.useAndroidX=true

# No legacy support-library dependencies are used anywhere in this project,
# so jetifier (which rewrites old support-library references to AndroidX)
# has nothing to do. Disabled to keep the build slightly faster.
android.enableJetifier=false

# Standard JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style used by the official Kotlin Gradle plugin.
kotlin.code.style=official
