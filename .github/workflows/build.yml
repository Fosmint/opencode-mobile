name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle-wrapper.jar is a binary file that can't be produced from this
      # repo alone; setup-gradle above provisions a real Gradle distribution
      # that we use once to (re)generate gradlew/gradlew.bat/wrapper.jar
      # matching gradle/wrapper/gradle-wrapper.properties. This keeps the
      # wrapper reproducible without committing a binary jar to source
      # control. If a committed wrapper is preferred, run
      # `gradle wrapper --gradle-version 8.9` locally once and commit the
      # generated files, then this step becomes a no-op guard.
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-debug
          path: app/build/outputs/apk/debug/*.apk
